name: ci

# Runs only when started by hand (Actions tab -> ci -> Run workflow). Not on every push / pull request:
# GitHub Actions minutes on a private repository are limited, and the owner does not want anything
# that could be billed to run by itself. Every change is checked locally with tools/build.ps1 instead.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - name: Build, test, layer check
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build.ps1 -Config ${{ matrix.config }}
